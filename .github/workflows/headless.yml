name: headless unit and build contracts
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      published_plugin_index:
        description: "Published Visor TEST OCI index digest for the container plugin contract"
        type: string
        required: false
  pull_request:
  push:
    branches: [main]
concurrency:
  group: headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  glibc:
    if: github.event_name != 'workflow_dispatch' || !inputs.published_plugin_index
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Require native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Reject desktop dependencies
        run: |
          cargo tree --locked -p hypermesh-visor --no-default-features --features headless --prefix none > "$RUNNER_TEMP/headless-dependencies"
          if grep -E '^(x11rb|zbus|keyring|secret-service) ' "$RUNNER_TEMP/headless-dependencies"; then
            exit 1
          fi
      - name: Unit contracts
        run: |
          cargo test --locked -p hypermesh-session --no-default-features --lib
          cargo test --locked -p hypermesh-visor --no-default-features --features headless --lib
      - name: Public plugin API and independent package contracts
        if: matrix.arch == 'x86_64'
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ ! -r "$profile" ]; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends apparmor-profiles
            fi
            # Load Ubuntu's sandbox launcher profile on this disposable CI runner.
            sudo apparmor_parser --replace "$profile"
          fi
          bash ci/plugin-contract.sh
      - name: Local AI catalog contract
        if: matrix.arch == 'x86_64'
        run: bash ci/tool-catalog-contract.sh
      - name: Build headless daemon
        run: cargo build --release --locked -p hypermesh-visor --no-default-features --features headless
      - uses: actions/upload-artifact@v4
        with:
          name: headless-glibc-${{ matrix.arch }}
          path: target/release/hypermesh-visor
          retention-days: 1
          if-no-files-found: error
  musl:
    if: github.event_name != 'workflow_dispatch' || !inputs.published_plugin_index
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and unit-test on native Alpine
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          docker build --file ci/headless/Dockerfile --build-arg "EXPECTED_ARCH=$EXPECTED_ARCH" --build-arg "SOURCE_REVISION=$GITHUB_SHA" --output "type=local,dest=$RUNNER_TEMP/headless" .
      - name: Build Alpine runtime image
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: docker build --file ci/headless/Dockerfile --target runtime --build-arg "EXPECTED_ARCH=$EXPECTED_ARCH" --build-arg "SOURCE_REVISION=$GITHUB_SHA" --tag visor-headless-ci .
      - name: Build stock Debian cloud worker and optional coding pack
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$EXPECTED_ARCH" in
            x86_64) architecture=amd64 ;;
            aarch64) architecture=arm64 ;;
            *) exit 2 ;;
          esac
          bash ci/cloud-worker/build.sh "$architecture" "$EXPECTED_ARCH" "$GITHUB_SHA" "$RUNNER_TEMP/cloud-worker"
      - name: Qualify worker startup and coding pack removal in disposable CI
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: bash ci/cloud-worker/qualify.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        with:
          name: visor-cloud-worker-${{ matrix.arch }}
          path: ${{ runner.temp }}/cloud-worker/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: headless-musl-${{ matrix.arch }}
          path: ${{ runner.temp }}/headless/
          retention-days: 1
          if-no-files-found: error

  published-container-plugin:
    if: github.event_name == 'workflow_dispatch' && inputs.published_plugin_index
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Run bundled plugin inside published TEST with standard Compose settings
        env:
          PUBLISHED_TEST_INDEX: ${{ inputs.published_plugin_index }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash ci/container/published-github-issue-contract.sh
